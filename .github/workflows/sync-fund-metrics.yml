name: "Fund Metrics Pipeline"

on:
  schedule:
    # Daily 05:30 IST = 00:00 UTC, Mon-Fri (runs AFTER daily-nav-update)
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Compute fund metrics (DB-only, zero external deps)
        run: npx tsx src/scripts/compute-fund-metrics.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
