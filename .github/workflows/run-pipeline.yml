name: Scheme Pipeline Nightly

on:
  schedule:
    # 6:15 AM IST = 00:45 UTC, Tue–Sat (after daily-nav-update at 5 AM IST).
    # Cron day list: Mon–Fri UTC → Tue–Sat IST (skip weekends, no fresh NAVs).
    - cron: '45 0 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated step names to run (default = all)'
        type: string
        required: false
        default: ''
      skip:
        description: 'Comma-separated step names to skip'
        type: string
        required: false
        default: ''
      risk_ratios_limit:
        description: 'risk_ratios: limit N candidates (0=all)'
        type: string
        required: false
        default: '0'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/scheme_pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r scripts/scheme_pipeline/requirements.txt

      - name: Run scheme pipeline
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          PIPELINE_LOG_LEVEL: INFO
          ONLY: ${{ github.event.inputs.only }}
          SKIP: ${{ github.event.inputs.skip }}
          PIPELINE_RISK_RATIOS_LIMIT: ${{ github.event.inputs.risk_ratios_limit }}
        working-directory: scripts
        run: |
          set -e
          ARGS=()
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ -n "$SKIP" ]; then ARGS+=(--skip "$SKIP"); fi
          python -m scheme_pipeline.jobs.daily_etl "${ARGS[@]}"

      - name: Report ingestion_run summary
        if: always()
        env:
          PGCONN: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          sudo apt-get install -y postgresql-client -qq >/dev/null
          psql "$PGCONN" -c "
            SELECT source, job_name, status, row_count,
                   started_at AT TIME ZONE 'Asia/Kolkata' AS started_ist,
                   ROUND(EXTRACT(EPOCH FROM (ended_at - started_at))::numeric, 1) AS seconds
            FROM ingestion_run
            WHERE started_at > NOW() - INTERVAL '1 hour'
            ORDER BY started_at;
          " || true
          psql "$PGCONN" -c "
            SELECT benchmark_name,
                   COUNT(*) AS rows,
                   MIN(date) AS first_date,
                   MAX(date) AS last_date
            FROM benchmark_data
            GROUP BY benchmark_name
            ORDER BY benchmark_name;
          " || true
          psql "$PGCONN" -c "
            SELECT column_name, data_type
            FROM information_schema.columns
            WHERE table_name = 'fund_returns'
              AND column_name IN (
                'alpha_1y','alpha_3y','alpha_5y',
                'beta_1y','beta_3y','beta_5y',
                'sortino_1y','sortino_3y','sortino_5y',
                'std_dev_1y','downside_deviation_1y',
                'information_ratio_3y','tracking_error_3y','r_squared_3y',
                'rolling_3y_mean','rolling_5y_mean','updated_at'
              )
            ORDER BY column_name;
          " || true
          psql "$PGCONN" -c "
            SELECT f.scheme_code,
                   LEFT(fn.scheme_name, 45) AS name,
                   fr.alpha_1y, fr.beta_1y, fr.r_squared_3y,
                   fr.sortino_3y, fr.std_dev_1y, fr.tracking_error_3y
            FROM fund_returns fr
            JOIN funds f  ON f.scheme_code = fr.scheme_code
            JOIN funds fn ON fn.scheme_code = fr.scheme_code
            WHERE fr.alpha_1y IS NOT NULL
            ORDER BY fr.updated_at DESC
            LIMIT 10;
          " || true
