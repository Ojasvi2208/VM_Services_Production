name: Probe benchmark_data + scheme_benchmark_map
on: {workflow_dispatch: {}}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          PGCONN: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          sudo apt-get install -y postgresql-client -qq >/dev/null
          psql "$PGCONN" -c "SELECT benchmark_name, COUNT(*), MIN(date), MAX(date) FROM benchmark_data GROUP BY 1 ORDER BY 2 DESC LIMIT 20;"
          psql "$PGCONN" -c "SELECT COUNT(*) FROM scheme_benchmark_map;"
