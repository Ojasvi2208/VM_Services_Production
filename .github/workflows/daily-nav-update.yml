name: Daily NAV Update

on:
  schedule:
    # Runs at 5:00 AM IST (23:30 UTC previous day) every day
    # AMFI publishes NAVs ~9:30 PM IST, RTAs finalize by ~1 AM IST
    # 5 AM gives 4+ hour buffer after RTA finalization
    - cron: '30 23 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 3 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run NAV Update Script
        env:
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: npx tsx src/scripts/daily-nav-update.ts

      - name: Log completion
        run: echo "NAV update completed at $(date)"
