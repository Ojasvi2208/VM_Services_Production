name: Daily NAV Update

on:
  schedule:
    # Runs at 5:00 AM IST (23:30 UTC previous day) — Tuesday to Saturday only
    # AMFI publishes NAVs ~9:30 PM IST, RTAs finalize by ~1 AM IST
    # 5 AM gives 4+ hour buffer after RTA finalization
    # Cron days: Mon-Fri UTC = Tue-Sat IST mornings (no NAV on Sat/Sun)
    - cron: '30 23 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # AMFI bulk download takes <1 minute, 15 min safety margin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run NAV Update Script
        env:
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: npx tsx src/scripts/daily-nav-update.ts

      - name: Refresh NFO Intelligence Cache
        run: |
          echo "Refreshing NFO cache + checking close date alerts..."
          NFO_RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.vmfinancialservices.com/api/cron/nfo-refresh")
          echo "NFO refresh response: $NFO_RESP"

      - name: Log completion
        run: echo "NAV update + NFO refresh completed at $(date)"
