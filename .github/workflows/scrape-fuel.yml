name: Fuel Price Cache Warm

on:
  schedule:
    # 6:30 AM IST = 01:00 UTC — warm cache before users wake up
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Warm fuel price cache
        run: |
          echo "Warming fuel price cache..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "https://www.vmfinancialservices.com/api/fuel-prices?all=true")
          echo "Response code: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Cache warmed successfully"
          else
            echo "Warning: Got HTTP $RESPONSE"
            exit 1
          fi
