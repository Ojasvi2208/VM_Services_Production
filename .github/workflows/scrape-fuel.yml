name: Fuel Price Daily Update

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC — prices update at 6 AM, cache warm + notify by 7 AM
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Warm fuel price cache
        run: |
          echo "Step 1: Warming fuel price cache..."
          CACHE_RESP=$(curl -s -o /dev/null -w "%{http_code}" "https://www.vmfinancialservices.com/api/fuel-prices?all=true")
          echo "Cache warm response: HTTP $CACHE_RESP"
          if [ "$CACHE_RESP" -ne 200 ]; then
            echo "Warning: Cache warm got HTTP $CACHE_RESP"
          fi

      - name: Send fuel price change alerts
        run: |
          echo "Step 2: Checking for price changes and sending alerts..."
          ALERT_RESP=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.vmfinancialservices.com/api/cron/fuel-alert")
          echo "Alert response: $ALERT_RESP"
