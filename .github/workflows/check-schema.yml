name: One-off schema check
on: {workflow_dispatch: {}}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          PGCONN: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          sudo apt-get install -y postgresql-client -qq >/dev/null
          psql "$PGCONN" -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_name='fund_returns' ORDER BY ordinal_position;"
